<title>Motion and Inertia Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column; grouped step tabs, canvas stage, readouts, controls. Plain CSS, no libraries, works offline. */
:root{
  --bg:#eef2f5; --panel:#ffffff; --stage:#f7fafc; --fg:#14212b; --muted:#566673; --line:#cfd9e0;
  --accent:#0a6f8c; --accent-fg:#ffffff; --ground:#d9e2e8;
  --wood:#d9a566; --wood2:#a9743a; --woodink:#5a3a14;
  --marble:#e4572e; --marble2:#a8330f; --vel:#2f7d4f;
  --b1:#3f6fb0; --b2:#c0504d; --b3:#4f9a6a; --b4:#d1a23a; --spine:rgba(0,0,0,.25); --block:#6b7b87; --warn:#b3261e;
  --sky:#dcecf6; --grass:#cfe6d0; --road:#8c99a3; --roadline:#f2f5f7; --busbody:#f2b632; --glass:#c4e4f2;
  --tyre:#1f2a33; --skin:#e3a878; --pants:#3a4a57; --tree:#4f9a6a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e161c; --panel:#16222b; --stage:#101a21; --fg:#e7eef3; --muted:#9bb0bd; --line:#2b3b47;
    --accent:#4cc3e0; --accent-fg:#06222b; --ground:#22323d;
    --wood:#b98547; --wood2:#e0b073; --woodink:#2b1a07;
    --marble:#ff7a50; --marble2:#b5421b; --vel:#6bd08e;
    --b1:#5b8ed0; --b2:#d8706d; --b3:#6bb888; --b4:#e0b856; --spine:rgba(0,0,0,.35); --block:#8fa2ae; --warn:#ff8a80;
    --sky:#15262f; --grass:#1b2e22; --road:#3a4852; --roadline:#cfd8de; --busbody:#d9a52a; --glass:#2c5266;
    --tyre:#0b1115; --skin:#d49a6a; --pants:#9fb2c0; --tree:#2f6e49;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e161c; --panel:#16222b; --stage:#101a21; --fg:#e7eef3; --muted:#9bb0bd; --line:#2b3b47;
  --accent:#4cc3e0; --accent-fg:#06222b; --ground:#22323d;
  --wood:#b98547; --wood2:#e0b073; --woodink:#2b1a07;
  --marble:#ff7a50; --marble2:#b5421b; --vel:#6bd08e;
  --b1:#5b8ed0; --b2:#d8706d; --b3:#6bb888; --b4:#e0b856; --spine:rgba(0,0,0,.35); --block:#8fa2ae; --warn:#ff8a80;
  --sky:#15262f; --grass:#1b2e22; --road:#3a4852; --roadline:#cfd8de; --busbody:#d9a52a; --glass:#2c5266;
  --tyre:#0b1115; --skin:#d49a6a; --pants:#9fb2c0; --tree:#2f6e49;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-top:16px; padding-bottom:28px;
  padding-left:16px; padding-right:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:760px; margin:0 auto}
h1{font-size:24px; line-height:1.2; margin:0 0 4px; letter-spacing:-.01em}
.sub{margin:0 0 14px; color:var(--muted)}
.seg{display:flex; flex-wrap:wrap; margin:0 -4px 6px}
.seg .grp{flex:1 1 100%; margin:8px 4px 0; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.07em}
.seg button{
  flex:1 1 40%; margin:4px; min-height:46px; padding:6px 10px; font:inherit; font-size:14px; font-weight:600; line-height:1.25;
  color:var(--fg); background:var(--panel); border:2px solid var(--line); border-radius:8px; cursor:pointer; text-align:left;
}
.seg button.on{border-color:var(--accent); color:var(--accent)}
button:focus,select:focus,input:focus{outline:3px solid var(--accent); outline-offset:2px}
.story{margin:6px 0 10px}
.stage{background:var(--stage); border:1px solid var(--line); border-radius:8px; overflow:hidden}
canvas{display:block; width:100%}
.status{margin:10px 0 0; min-height:24px; font-weight:600}
.status.warn{color:var(--warn)}
.read{display:flex; flex-wrap:wrap; margin:6px -4px 0}
.cell{flex:1 1 40%; margin:4px; padding:8px 12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; min-width:0}
.cell span{display:block; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.cell b{display:block; font-size:22px; line-height:1.25; font-variant-numeric:tabular-nums}
.cell small{font-size:13px; font-weight:400; color:var(--muted)}
.pred{margin:10px 0 0; color:var(--muted)}
.pred.warn{color:var(--warn); font-weight:600}
.tbl{margin-top:12px; overflow-x:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px}
.tbl table{width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 10px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
.tbl th{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
.tbl tr:last-child td{border-bottom:0}
.panel{margin-top:12px; padding:12px 14px; background:var(--panel); border:1px solid var(--line); border-radius:8px}
.ctl{margin:0 0 12px}
.ctl label{display:block; margin-bottom:2px}
.ctl label b{color:var(--accent); font-variant-numeric:tabular-nums}
input[type=range]{width:100%; height:32px; margin:0}
select{width:100%; min-height:44px; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:0 8px}
.btns{display:flex; margin:0 -4px}
.btns button{
  flex:1 1 0; margin:0 4px; min-height:48px; font:inherit; font-weight:700; border-radius:8px; cursor:pointer;
  color:var(--fg); background:var(--panel); border:2px solid var(--line);
}
.btns button.primary{background:var(--accent); color:var(--accent-fg); border-color:var(--accent); flex:2 1 0}
.link{display:block; margin:10px 0 0; padding:8px 0; font:inherit; font-size:14px; color:var(--accent); background:none; border:0; cursor:pointer; text-decoration:underline}
.note{margin:14px 0 0; font-size:13px; color:var(--muted)}
.note p{margin:0 0 6px}
</style>

<div class="wrap">
  <h1>Motion and Inertia Lab</h1>
  <p class="sub">A marble on two planks, and what happens to your body in a bus or a car.</p>

  <div class="seg">
    <p class="grp">The marble experiment</p>
    <button id="m1" class="on" type="button" aria-pressed="true">1 &middot; Rolling down</button>
    <button id="m2" type="button" aria-pressed="false">2 &middot; Rolling up</button>
    <button id="m3" type="button" aria-pressed="false">3 &middot; Decreasing the inclination</button>
    <button id="m4" type="button" aria-pressed="false">4 &middot; Horizontal second plank</button>
    <p class="grp">Inertia in a vehicle</p>
    <button id="m5" type="button" aria-pressed="false">5 &middot; Bending forward when brakes are applied</button>
    <button id="m6" type="button" aria-pressed="false">6 &middot; Bending backward when a bus starts</button>
    <button id="m7" type="button" aria-pressed="false">7 &middot; Leaning sideways when a car turns</button>
  </div>

  <p class="story" id="story"></p>

  <div class="stage"><canvas id="cv" role="img" aria-label="Animated physics scene"></canvas></div>
  <p class="status" id="st" aria-live="polite"></p>

  <div class="read">
    <div class="cell"><span id="rTl">Time</span><b id="rT">0.00 <small>s</small></b></div>
    <div class="cell"><span id="rVl">Speed</span><b id="rV">0 <small>cm/s</small></b></div>
    <div class="cell"><span id="rHl">Height now</span><b id="rH">0.0 <small>cm</small></b></div>
    <div class="cell"><span id="r4l">Distance covered</span><b id="r4">0.0 <small>cm</small></b></div>
  </div>
  <p class="pred" id="pred"></p>

  <div class="tbl" id="tbl" hidden>
    <table>
      <thead><tr><th>Plank 2 angle</th><th>Distance up plank 2</th><th>Height reached</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>

  <div class="panel">
    <div id="plankCtl">
      <div class="ctl">
        <label for="h">Height of the books under plank 1 <b id="hOut"></b></label>
        <input id="h" type="range" min="4" max="25" step="1" value="10">
      </div>
      <div class="ctl" id="aWrap" hidden>
        <label for="a">Inclination of plank 2 <b id="aOut"></b></label>
        <input id="a" type="range" min="4" max="40" step="1" value="30">
      </div>
      <div class="ctl">
        <label for="fr">Friction</label>
        <select id="fr">
          <option value="0.004" selected>Slight friction (real marble)</option>
          <option value="0">No friction (ideal)</option>
        </select>
      </div>
    </div>
    <div id="vehCtl" hidden>
      <div class="ctl" id="vaWrap">
        <label for="va"><span id="vaLbl">Braking strength</span> <b id="vaOut"></b></label>
        <input id="va" type="range" min="2" max="8" step="0.5" value="5">
      </div>
      <div class="ctl" id="vsWrap" hidden>
        <label for="vs">Speed of the car <b id="vsOut"></b></label>
        <input id="vs" type="range" min="20" max="45" step="1" value="30">
      </div>
      <div class="ctl" id="vdWrap" hidden>
        <label for="vdir">Direction of the turn</label>
        <select id="vdir">
          <option value="1" selected>Left turn</option>
          <option value="-1">Right turn</option>
        </select>
      </div>
    </div>
    <div class="ctl">
      <label for="rate">Playback</label>
      <select id="rate">
        <option value="1">Real time</option>
        <option value="0.5" selected>Half speed</option>
        <option value="0.25">Quarter speed</option>
      </select>
    </div>
    <div class="btns">
      <button id="go" class="primary" type="button">Release marble</button>
      <button id="reset" type="button">Reset</button>
    </div>
    <button id="clear" class="link" type="button" hidden>Clear the marks from earlier runs</button>
  </div>

  <div class="note">
    <p id="watch"></p>
    <p id="note2"></p>
  </div>
</div>

<script>
(function () {
  var G = 980, L1 = 100, L2 = 120, U0 = 5, USTOP = 94, DT = 0.002, EPS = 0.01;
  // vehicle scenes (metres, seconds)
  var V0B = 8, V1S = 10, TB = 1.2, TS = 0.8, LEANL = 0.5, W02 = 45, ZETA = 0.45, TURN_R = 20, LEAD = 10;
  var CDAMP = 2 * ZETA * Math.sqrt(W02);
  var FONT = 'system-ui,"Segoe UI",Roboto,Arial,sans-serif';

  function $(id) { return document.getElementById(id); }
  var cv = $('cv'), ctx = cv.getContext('2d');
  var hEl = $('h'), aEl = $('a'), frEl = $('fr'), rateEl = $('rate'), goEl = $('go'), resetEl = $('reset'), clearEl = $('clear');
  var vaEl = $('va'), vsEl = $('vs'), vdirEl = $('vdir');
  var mBtn = [null, $('m1'), $('m2'), $('m3'), $('m4'), $('m5'), $('m6'), $('m7')];

  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
            function (f) { return window.setTimeout(f, 16); };

  var mode = 1, phase = 'ready';
  // planks state
  var u = U0, v = 0, tSim = 0, path = 0, yMax = 0, peaked = false, peakD = 0, peakY = 0, endReason = '', endSpeed = 0;
  var P = null, trials = [];
  // vehicle state
  var vt = 0, vdist = 0, vv = 0, vacc = 0, vf = 0, th = 0, thd = 0, thMax = 0, VP = null;
  var cssW = 300, cssH = 200, dpr = 1, C = {};

  var NAMES = ['stage','fg','muted','line','accent','ground','wood','wood2','woodink','marble','marble2',
               'vel','b1','b2','b3','b4','spine','block','panel','sky','grass','road','roadline','busbody','glass',
               'tyre','skin','pants','tree','warn'];
  function readColors() {
    var cs = window.getComputedStyle(document.documentElement);
    for (var i = 0; i < NAMES.length; i++) C[NAMES[i]] = cs.getPropertyValue('--' + NAMES[i]).replace(/^\s+|\s+$/g, '');
  }

  function ang2() { return mode === 2 ? 30 : (mode === 3 ? parseFloat(aEl.value) : 0); }
  function readP() {
    var h1 = parseFloat(hEl.value), s1 = h1 / L1, th1 = Math.asin(s1), a2 = ang2(), th2 = a2 * Math.PI / 180;
    return { h1: h1, s1: s1, c1: Math.cos(th1), th1: th1, a2: a2, th2: th2, s2: Math.sin(th2), c2: Math.cos(th2),
             fr: parseFloat(frEl.value) };
  }
  function readV() {
    var kmh = parseFloat(vsEl.value);
    return { A: parseFloat(vaEl.value), kmh: kmh, V: kmh / 3.6, dir: parseFloat(vdirEl.value), R: TURN_R };
  }

  /* ---------- planks physics ---------- */
  function accel(uu, vv2, p) {
    var onP2 = (mode !== 1 && uu >= L1);
    var gp = onP2 ? -(5 / 7) * G * p.s2 : (5 / 7) * G * p.s1;
    var fr = p.fr * G * (onP2 ? p.c2 : p.c1);
    if (vv2 > EPS) return gp - fr;
    if (vv2 < -EPS) return gp + fr;
    if (Math.abs(gp) <= fr) return 0;
    return gp > 0 ? gp - fr : gp + fr;
  }

  function finish(reason) {
    phase = 'done'; endReason = reason; endSpeed = Math.abs(v);
    if (mode >= 2) {
      var d = (reason === 'end') ? L2 : (peaked ? peakD : Math.max(0, u - L1));
      trials.push({ a2: P.a2, th2: P.th2, d: d, y: d * P.s2, off: reason === 'end' });
      if (trials.length > 6) trials.shift();
    }
  }

  function stepPhys(h) {
    var vOld = v, a = accel(u, v, P);
    v += a * h;
    if (vOld * v < 0) v = 0;
    u += v * h; tSim += h; path += Math.abs(v) * h;
    if (mode === 1) {
      if (u >= USTOP) { u = USTOP; finish('bottom'); v = 0; }
      return;
    }
    if (u >= L1 + L2) { u = L1 + L2; finish('end'); return; }
    if (u > L1) {
      var y = (u - L1) * P.s2;
      if (y > yMax) yMax = y;
      if (!peaked && vOld > 0 && v <= 0) { peaked = true; peakD = u - L1; peakY = y; }
    }
    if (peaked && u <= L1) { finish('returned'); return; }
    if (v === 0 && accel(u, 0, P) === 0) { finish('stopped'); return; }
    if (tSim > 60) finish('timeout');
  }

  /* ---------- vehicle physics ---------- */
  function eventEnd(p) {
    if (mode === 5) return TB + V0B / p.A;
    if (mode === 6) return TS + V1S / p.A;
    return (LEAD + Math.PI * p.R / 2) / p.V;
  }
  function stepVeh(h) {
    var p = VP, arc = Math.PI * p.R / 2;
    vt += h;
    if (mode === 5) {
      if (vt < TB) { vv = V0B; vacc = 0; vf = 0; }
      else if (vt < TB + V0B / p.A) { vv = V0B - p.A * (vt - TB); vacc = -p.A; vf = p.A; }
      else { vv = 0; vacc = 0; vf = 0; }
      vdist += vv * h;
    } else if (mode === 6) {
      if (vt < TS) { vv = 0; vacc = 0; vf = 0; }
      else if (vt < TS + V1S / p.A) { vv = p.A * (vt - TS); vacc = p.A; vf = -p.A; }
      else { vv = V1S; vacc = 0; vf = 0; }
      vdist += vv * h;
    } else {
      vv = p.V; vdist = -LEAD + p.V * vt;
      if (vdist >= 0 && vdist <= arc) { vacc = p.V * p.V / p.R; vf = p.dir * vacc; } else { vacc = 0; vf = 0; }
    }
    // upper body: hinged at the hips, held up by muscles, pushed by the sudden change of motion
    var ath = (vf / LEANL) * Math.cos(th) + (9.8 / LEANL) * Math.sin(th) - W02 * th - CDAMP * thd;
    thd += ath * h; th += thd * h;
    if (th > 1.2) { th = 1.2; thd = 0; } else if (th < -1.2) { th = -1.2; thd = 0; }
    if (Math.abs(th) > Math.abs(thMax)) thMax = th;
    var te = eventEnd(p);
    if ((vt > te + 0.4 && Math.abs(th) < 0.02 && Math.abs(thd) < 0.1) || vt > te + 4) phase = 'done';
  }

  /* ---------- drawing helpers ---------- */
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r); ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r); ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
  }
  function arrow(x1, y1, x2, y2, col, w) {
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = w; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    var ang = Math.atan2(y2 - y1, x2 - x1), hl = 8;
    ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - hl * Math.cos(ang - 0.45), y2 - hl * Math.sin(ang - 0.45));
    ctx.lineTo(x2 - hl * Math.cos(ang + 0.45), y2 - hl * Math.sin(ang + 0.45));
    ctx.closePath(); ctx.fill();
  }
  function label(txt, x, y, col, align) {
    ctx.font = '600 11px ' + FONT; ctx.fillStyle = col; ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(txt, x, y);
  }
  var K = 1;
  function ticks(len) {
    ctx.strokeStyle = C.woodink; ctx.lineWidth = 1; ctx.beginPath();
    for (var c = 0; c <= len; c += 10) { var tx = Math.round(c * K) + 0.5; ctx.moveTo(tx, 2); ctx.lineTo(tx, 2 + (c % 50 === 0 ? 6 : 3.5)); }
    ctx.stroke();
  }

  /* ---------- scene 1-4: planks ---------- */
  function drawPlanks() {
    var p = readP(), W = cssW, H = cssH, i;
    var k = (W - 44) / 226; K = k;
    var gy = H - 18, tpx = Math.max(9, Math.round(k * 2.6)), rpx = Math.max(5.5, k * 1.8);
    var x0 = 34, jx = x0 + L1 * p.c1 * k, jy = gy - tpx, P1y = jy - L1 * k * p.s1;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = C.stage; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = C.ground; ctx.fillRect(0, gy, W, H - gy);
    ctx.fillStyle = C.muted; ctx.fillRect(0, gy, W, 1.5);

    var xr = x0 + 8 * k * p.c1, bw = Math.min(xr - 4, 70);
    var topY = P1y + 8 * k * p.s1 + tpx / p.c1;
    var stackH = Math.max(8, gy - topY), n = Math.max(1, Math.round(p.h1 / 3)), bh = stackH / n;
    for (i = 0; i < n; i++) {
      var by = gy - (i + 1) * bh, ox = (i === n - 1) ? 0 : ((i % 2) ? 3 : -3);
      ctx.fillStyle = C['b' + (1 + (i % 4))]; ctx.fillRect(xr - bw + ox, by, bw, bh);
      ctx.fillStyle = C.spine; ctx.fillRect(xr - bw + ox, by, Math.max(4, bw * 0.1), bh);
      ctx.strokeStyle = C.spine; ctx.lineWidth = 1; ctx.strokeRect(xr - bw + ox + 0.5, by + 0.5, bw - 1, bh - 1);
    }

    ctx.save(); ctx.translate(x0, P1y); ctx.rotate(p.th1);
    ctx.fillStyle = C.wood; ctx.fillRect(0, 0, L1 * k, tpx);
    ctx.fillStyle = C.wood2; ctx.fillRect(0, 0, L1 * k, 2);
    ticks(L1);
    if (mode === 1) { ctx.fillStyle = C.block; ctx.fillRect(USTOP * k + rpx + 1, -rpx * 2.2, 4, rpx * 2.2); }
    ctx.restore();

    if (mode >= 2) {
      ctx.save(); ctx.translate(jx, jy); ctx.rotate(-p.th2);
      ctx.fillStyle = C.wood; ctx.fillRect(0, 0, L2 * k, tpx);
      ctx.fillStyle = C.wood2; ctx.fillRect(0, 0, L2 * k, 2);
      ticks(L2);
      ctx.fillStyle = C.block; ctx.fillRect(L2 * k, -rpx * 2.2, 4, rpx * 2.2 + tpx);
      ctx.restore();
      ctx.fillStyle = C.wood; ctx.beginPath();
      ctx.moveTo(jx, jy); ctx.lineTo(jx - tpx * Math.sin(p.th1), jy + tpx * Math.cos(p.th1));
      ctx.lineTo(jx + tpx * Math.sin(p.th2), jy + tpx * Math.cos(p.th2)); ctx.closePath(); ctx.fill();

      var ly = jy - (L1 - U0) * k * p.s1 - rpx * p.c1;
      ctx.strokeStyle = C.accent; ctx.lineWidth = 1.5;
      if (ctx.setLineDash) ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.moveTo(x0 + 24, ly); ctx.lineTo(W - 6, ly); ctx.stroke();
      if (ctx.setLineDash) ctx.setLineDash([]);
      label('start height', W - 8, ly - 5, C.accent, 'right');

      for (i = 0; i < trials.length; i++) {
        var T = trials[i], tx = jx + T.d * k * Math.cos(T.th2), ty = jy - T.d * k * Math.sin(T.th2) - rpx * Math.cos(T.th2);
        ctx.strokeStyle = C.muted; ctx.lineWidth = 1.2;
        if (ctx.setLineDash) ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.moveTo(jx, jy - rpx); ctx.lineTo(tx, ty); ctx.stroke();
        if (ctx.setLineDash) ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(tx, ty, 4, 0, Math.PI * 2);
        if (T.off) { ctx.lineWidth = 2; ctx.strokeStyle = C.accent; ctx.stroke(); }
        else { ctx.fillStyle = C.accent; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = C.stage; ctx.stroke(); }
      }
    }

    ctx.save();

  }

  /* ---------- scene 5-6: bus, side view ---------- */
  function drawStanding(hx, hy, floorY, s, t) {
    var Lt = 0.62 * s, sn = Math.sin(t), cs = Math.cos(t), sx = hx + 0.52 * Lt * sn, sy = hy - 0.52 * Lt * cs, i;

    ctx.strokeStyle = C.pants; ctx.lineWidth = 0.15 * s;
    ctx.beginPath(); ctx.moveTo(hx - 0.04 * s, hy); ctx.lineTo(hx - 0.13 * s, floorY - 0.04 * s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx + 0.04 * s, hy); ctx.lineTo(hx + 0.15 * s, floorY - 0.04 * s); ctx.stroke();
    ctx.strokeStyle = C.fg; ctx.lineWidth = 0.1 * s;
    ctx.beginPath(); ctx.moveTo(hx - 0.13 * s, floorY - 0.03 * s); ctx.lineTo(hx - 0.02 * s, floorY - 0.03 * s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx + 0.15 * s, floorY - 0.03 * s); ctx.lineTo(hx + 0.26 * s, floorY - 0.03 * s); ctx.stroke();
    var a = -0.45 * t, hxd = sx + 0.55 * s * Math.sin(a), hyd = sy + 0.55 * s * Math.cos(a);
    ctx.strokeStyle = C.accent; ctx.lineWidth = 0.1 * s;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hxd, hyd); ctx.stroke();
    ctx.fillStyle = C.skin; ctx.beginPath(); ctx.arc(hxd, hyd, 0.06 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.accent; ctx.lineWidth = 0.27 * s;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + Lt * sn, hy - Lt * cs); ctx.stroke();

    ctx.fillStyle = C.skin; ctx.beginPath(); ctx.arc(cx2, cy2, 0.13 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.fg; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx2 + 0.06 * s, cy2 - 0.02 * s, 1, 0, Math.PI * 2); ctx.stroke();

  }

  function drawBus() {
    var W = cssW, H = cssH, i, s = Math.min(H * 0.2, (W - 20) / 7.4), roadY = H - 20;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = C.sky; ctx.fillRect(0, 0, W, H);
    var gh = 0.8 * s;
    ctx.fillStyle = C.grass; ctx.fillRect(0, roadY - gh, W, gh);
    var sp = 5 * s, off = (vdist * s * 0.4) % sp, base = roadY - gh * 0.5;
    for (i = -1; i <= Math.ceil(W / sp) + 1; i++) {
      var tx = i * sp - off + ((i % 2) ? 0.9 * s : 0), tr = (i % 2) ? 0.5 : 0.65;
      ctx.fillStyle = C.wood2; ctx.fillRect(tx - 0.09 * s, base - 0.9 * s, 0.18 * s, 0.9 * s);
      ctx.fillStyle = C.tree; ctx.beginPath(); ctx.arc(tx, base - 1.15 * s, tr * s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = C.road; ctx.fillRect(0, roadY, W, H - roadY);
    var per = 4 * s, doff = (vdist * s) % per;
    ctx.fillStyle = C.roadline;
    for (var x = -doff; x < W; x += per) ctx.fillRect(x, roadY + 9, 2 * s, 2);

    var bx = (W - 7 * s) / 2, bodyBottom = roadY - 0.55 * s, bodyTop = bodyBottom - 2.7 * s, floorY = bodyBottom - 0.12 * s;
    ctx.fillStyle = C.busbody; rr(bx, bodyTop, 7 * s, 2.7 * s, 0.35 * s); ctx.fill();
    ctx.fillStyle = C.glass; rr(bx + 0.25 * s, bodyTop + 0.3 * s, 6.5 * s, 2.1 * s, 0.15 * s); ctx.fill();

    var hipX = bx + 3.5 * s, hipY = floorY - 0.85 * s;
    var head = drawStanding(hipX, hipY, floorY, s, th);

    ctx.fillStyle = C.busbody;
    var px = [1.4, 2.8, 4.2, 5.6];
    for (i = 0; i < px.length; i++) ctx.fillRect(bx + px[i] * s - 0.06 * s, bodyTop + 0.3 * s, 0.12 * s, 2.1 * s);
    ctx.fillStyle = C.busbody; ctx.fillRect(bx, floorY - 0.02 * s, 7 * s, 0.14 * s);

    ctx.fillStyle = '#fff6c2'; ctx.beginPath(); ctx.arc(bx + 6.85 * s, bodyBottom - 0.5 * s, 0.13 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = (mode === 5 && vacc < 0) ? '#ff3b30' : '#8a2a25';
    ctx.fillRect(bx - 0.02 * s, bodyBottom - 0.75 * s, 0.14 * s, 0.4 * s);

    var rot = vdist / 0.45, wxs = [bx + 1.3 * s, bx + 5.6 * s], wy = roadY - 0.45 * s;
    for (i = 0; i < 2; i++) {
      ctx.fillStyle = C.tyre; ctx.beginPath(); ctx.arc(wxs[i], wy, 0.45 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c7d0d6'; ctx.beginPath(); ctx.arc(wxs[i], wy, 0.2 * s, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.translate(wxs[i], wy); ctx.rotate(rot);
      ctx.strokeStyle = '#6b7b87'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-0.17 * s, 0); ctx.lineTo(0.17 * s, 0); ctx.stroke();
      ctx.restore();
    }

    if (vacc !== 0) {
      var dir = vacc > 0 ? 1 : -1, len = (Math.abs(vacc) / 8) * 1.8 * s + 0.5 * s, ay = bodyTop - 0.5 * s, ax = bx + 3.5 * s;
      arrow(ax - dir * len / 2, ay, ax + dir * len / 2, ay, C.marble, 3);
      label(mode === 5 ? 'bus slows down' : 'bus speeds up', ax, ay - 8, C.marble);
    }
    if (vf !== 0) {
      var d2 = vf > 0 ? 1 : -1, l2 = (Math.abs(vf) / 8) * 1.4 * s + 0.4 * s;
      arrow(head.x, head.y - 0.32 * s, head.x + d2 * l2, head.y - 0.32 * s, C.vel, 3);
      label('inertia', head.x + d2 * l2 / 2, head.y - 0.32 * s - 7, C.vel);
    }
    label(mode === 5 ? 'Bus moves to the right' : 'Bus moves to the right', 10, 16, C.muted, 'left');
  }

  /* ---------- scene 7: car turning, top view + rear view ---------- */
  function pathPos(d, R, dir) {
    var arc = Math.PI * R / 2;
    if (d < 0) return { x: 0, y: d, psi: 0 };
    if (d <= arc) { var a = d / R; return { x: dir * (-R + R * Math.cos(a)), y: R * Math.sin(a), psi: dir * a }; }
    var e = d - arc; return { x: dir * (-R) - dir * e, y: R, psi: dir * Math.PI / 2 };
  }

  function drawTurn() {
    var W = cssW, H = cssH, topH = Math.round(H * 0.5), p = readV(), R = p.R, dir = p.dir, i;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = C.stage; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = C.grass; ctx.fillRect(0, 0, W, topH);
    ctx.translate(cx, cy); ctx.rotate(pos.psi); ctx.scale(s1, -s1); ctx.translate(-pos.x, -pos.y);
    for (i = 0; i <= 9; i++) {
      ctx.fillStyle = C.tree;
      ctx.beginPath(); ctx.arc(-9, -i * 8, 1.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(9, -i * 8 - 4, 1.3, 0, Math.PI * 2); ctx.fill();
      if (i > 0) {
        ctx.beginPath(); ctx.arc(dir * (-R - i * 8), R + 9, 1.3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(dir * (-R - i * 8 - 4), R - 9, 1.3, 0, Math.PI * 2); ctx.fill();
      }
    }
    function roadPath() {
      ctx.beginPath(); ctx.moveTo(0, -90); ctx.lineTo(0, 0);
      if (dir > 0) { ctx.arc(-R, 0, R, 0, Math.PI / 2, false); ctx.lineTo(-R - 90, R); }
      else { ctx.arc(R, 0, R, Math.PI, Math.PI / 2, true); ctx.lineTo(R + 90, R); }
    }
    ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
    ctx.strokeStyle = C.road; ctx.lineWidth = 6; roadPath(); ctx.stroke();
    ctx.strokeStyle = C.roadline; ctx.lineWidth = 0.25;
    if (ctx.setLineDash) ctx.setLineDash([2, 2]);
    roadPath(); ctx.stroke();
    if (ctx.setLineDash) ctx.setLineDash([]);
    ctx.restore();

    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, topH); ctx.clip();
    var psiMag = Math.abs(pos.psi), turning = (vdist > 0 && vdist < Math.PI * R / 2);
    if (turning && phase !== 'ready') {
      arrow(cx, cy, cx + dir * Math.sin(psiMag) * 4.2 * s1, cy - Math.cos(psiMag) * 4.2 * s1, C.vel, 2.5);
      label('straight on', cx + dir * Math.sin(psiMag) * 4.2 * s1 + dir * 4, cy - Math.cos(psiMag) * 4.2 * s1 - 6, C.vel, dir > 0 ? 'left' : 'right');
    }
    ctx.fillStyle = C.b1; rr(cx - 0.95 * s1, cy - 2.2 * s1, 1.9 * s1, 4.4 * s1, 0.45 * s1); ctx.fill();
    ctx.fillStyle = C.glass; rr(cx - 0.75 * s1, cy - 1.2 * s1, 1.5 * s1, 0.8 * s1, 0.15 * s1); ctx.fill();

    ctx.fillStyle = C.accent; ctx.beginPath(); ctx.ellipse ? ctx.ellipse(cx + 0.4 * s1 + lean, cy + 0.4 * s1, 0.5 * s1, 0.28 * s1, 0, 0, Math.PI * 2) : ctx.arc(cx + 0.4 * s1 + lean, cy + 0.4 * s1, 0.4 * s1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.skin; ctx.beginPath(); ctx.arc(cx + 0.4 * s1 + lean * 1.3, cy + 0.4 * s1, 0.2 * s1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    label('Top view', 10, 16, C.fg, 'left');
    ctx.fillStyle = C.line; ctx.fillRect(0, topH, W, 1);

    // rear view of the passenger
    var h2 = H - topH, s2 = h2 / 2.2, mid = W / 2, seatTop = H - 0.7 * s2;
    ctx.fillStyle = C.glass; rr(mid - 1.7 * s2, topH + 8, 3.4 * s2, h2 - 12, 0.2 * s2); ctx.fill();
    ctx.fillStyle = C.b1; ctx.fillRect(mid - 1.7 * s2, H - 0.18 * s2 - 4, 3.4 * s2, 0.18 * s2);
    ctx.fillStyle = C.block; rr(mid - 0.42 * s2, seatTop - 0.95 * s2, 0.84 * s2, 0.95 * s2, 0.12 * s2); ctx.fill();
    ctx.fillStyle = C.block; rr(mid - 0.58 * s2, seatTop, 1.16 * s2, 0.24 * s2, 0.08 * s2); ctx.fill();
    ctx.fillStyle = C.spine; ctx.fillRect(mid - 0.2 * s2, seatTop + 0.24 * s2, 0.4 * s2, H - 0.18 * s2 - 4 - seatTop - 0.24 * s2);
    var Lt = 0.66 * s2, sn = Math.sin(th), cs = Math.cos(th), hx = mid, hy = seatTop, ls = 0.52 * Lt;
    ctx.lineCap = 'round';
    ctx.strokeStyle = C.pants; ctx.lineWidth = 0.17 * s2;
    ctx.beginPath(); ctx.moveTo(mid - 0.2 * s2, seatTop + 0.02 * s2); ctx.lineTo(mid - 0.22 * s2, H - 0.18 * s2 - 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mid + 0.2 * s2, seatTop + 0.02 * s2); ctx.lineTo(mid + 0.22 * s2, H - 0.18 * s2 - 6); ctx.stroke();
    var a1 = -0.45 * th, sx0 = hx + ls * sn, sy0 = hy - ls * cs;
    ctx.strokeStyle = C.accent; ctx.lineWidth = 0.11 * s2;
    ctx.beginPath(); ctx.moveTo(sx0 - 0.17 * s2, sy0); ctx.lineTo(sx0 - 0.19 * s2 + 0.5 * s2 * Math.sin(a1), sy0 + 0.5 * s2 * Math.cos(a1)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx0 + 0.17 * s2, sy0); ctx.lineTo(sx0 + 0.19 * s2 + 0.5 * s2 * Math.sin(a1), sy0 + 0.5 * s2 * Math.cos(a1)); ctx.stroke();
    ctx.strokeStyle = C.accent; ctx.lineWidth = 0.4 * s2;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + Lt * sn, hy - Lt * cs); ctx.stroke();
    var hdx = hx + (Lt + 0.22 * s2) * sn, hdy = hy - (Lt + 0.22 * s2) * cs;
    ctx.fillStyle = C.skin; ctx.beginPath(); ctx.arc(hdx, hdy, 0.17 * s2, 0, Math.PI * 2); ctx.fill();
    label('Seen from behind', 10, topH + 16, C.fg, 'left');
    if (vf !== 0) {
      var d2 = vf > 0 ? 1 : -1, l2 = (Math.abs(vf) / 8) * 1.2 * s2 + 0.35 * s2;
      arrow(hdx, hdy - 0.34 * s2, hdx + d2 * l2, hdy - 0.34 * s2, C.vel, 3);
      label('inertia: body tends to go straight', mid, topH + 32, C.vel);
      var ty = topH + 50, tl = 0.9 * s2;
      arrow(mid - dir * tl / 2, ty, mid + dir * tl / 2, ty, C.marble, 3);
      label(dir > 0 ? 'car turns left' : 'car turns right', mid + dir * (tl / 2 + 6), ty + 4, C.marble, dir > 0 ? 'right' : 'left');
    }
  }

  function render() {
    if (mode <= 4) drawPlanks(); else if (mode <= 6) drawBus(); else drawTurn();
  }

  /* ---------- text and readouts ---------- */
  function fmt(x, d) { return x.toFixed(d); }
  function cell(id, val, unit) { $(id).innerHTML = val + ' <small>' + unit + '</small>'; }

  var STORY = [
    '',
    'The pupil-teacher inclines a plank with the help of books and releases the marble from the upper end of the plank.',
    'The pupil-teacher places a second inclined plank in front of the first plank and releases the marble down the first plank.',
    'The pupil-teacher gradually decreases the inclination of the second plank and releases the marble from the first plank each time.',
    'The pupil-teacher places the second plank completely horizontal and releases the marble from the first plank.',
    'A passenger stands in a bus. The driver applies the brakes suddenly, and the passenger bends forward.',
    'A passenger stands in a bus at rest. The bus starts suddenly, and the passenger bends backward.',
    'A passenger sits in a car. The car turns suddenly, and the passenger leans to one side.'
  ];
  var WATCH = [
    '',
    'Watch for: the marble keeps speeding up all the way down. A steeper plank gives a bigger acceleration and a shorter time.',
    'Watch for: the marble rolls up the second plank and stops close to the height it started from (the dashed line).',
    'Watch for: as plank 2 gets flatter, the marble travels farther along it, yet each mark stays near the same height. Lower the slider a little at a time and release each time.',

    'Why: the floor drags the feet forward with the bus, but the upper body stays at rest for a moment by inertia, so it bends backward. Try a stronger start.',
    'Why: the car is forced to change direction, but the body tries to keep moving in a straight line (the dashed arrow), so it leans toward the outside of the turn. Try a faster car or a right turn.'
  ];
  var NOTE2 = [
    '',
    'Green arrow: velocity. Dashed line: the height the marble started from. The marble is a solid sphere rolling without slipping, so on a plank it speeds up or slows down at (5/7) × g × sin θ.',
    'Green arrow: velocity. Dashed line: the height the marble started from. Round marks on plank 2: the highest point reached in each run. The marble is a solid sphere rolling without slipping.',
    'Round marks on plank 2: the highest point reached in each run. Each earlier angle stays on the screen as a dotted line so you can compare them.',
    'A hollow ring on the plank end means the marble ran off the end. The marble is a solid sphere rolling without slipping, with only a very small friction.',
    'Inertia is the tendency of a body to stay at rest, or keep moving in a straight line at constant speed, unless a force acts on it (Newton’s first law). A force acts only on the parts of your body that the floor or seat touches.',
    'Inertia is the tendency of a body to stay at rest, or keep moving in a straight line at constant speed, unless a force acts on it (Newton’s first law). A force acts only on the parts of your body that the floor or seat touches.',
    'Inertia is the tendency of a body to stay at rest, or keep moving in a straight line at constant speed, unless a force acts on it (Newton’s first law). Friction between tyres and road gives the car the sideways push it needs to turn, but the passenger’s upper body feels no such push.'
  ];
  var GO = { 1: 'Release marble', 2: 'Release marble', 3: 'Release marble', 4: 'Release marble', 5: 'Brake suddenly', 6: 'Start suddenly', 7: 'Turn suddenly' };

  function labelGo() {
    goEl.innerHTML = { ready: GO[mode], run: 'Pause', paused: 'Resume', done: 'Run again' }[phase];
  }
  function currentHeight(p) { return (mode !== 1 && u >= L1) ? (u - L1) * p.s2 : (L1 - u) * p.s1; }

  function updatePlankUI() {
    var p = readP(), ready = (phase === 'ready'), i;
    $('hOut').innerHTML = p.h1 + ' cm';
    $('aOut').innerHTML = aEl.value + '°';
    $('rTl').innerHTML = 'Time'; $('rVl').innerHTML = 'Speed'; $('rHl').innerHTML = 'Height now';
    cell('rT', fmt(tSim, 2), 's');
    cell('rV', fmt(Math.abs(v), 0), 'cm/s');
    cell('rH', fmt(currentHeight(p), 1), 'cm');
    if (mode === 1) { $('r4l').innerHTML = 'Distance covered'; cell('r4', fmt(path, 1), 'cm'); }
    else { $('r4l').innerHTML = 'Highest on plank 2'; cell('r4', fmt(yMax, 1), 'cm'); }

    var H0 = (L1 - U0) * p.s1, a1 = (5 / 7) * G * p.s1, vj = Math.sqrt((10 / 7) * G * H0), pred = $('pred'), st = $('st'), msg;
    pred.className = 'pred'; st.className = 'status';
    if (mode === 1) {
      var tt = Math.sqrt(2 * (USTOP - U0) / a1);
      pred.innerHTML = 'Prediction: the marble reaches the bottom after about ' + fmt(tt, 2) + ' s, moving at about ' + fmt(a1 * tt, 0) + ' cm/s.';
    } else if (p.s2 === 0) {
      pred.innerHTML = 'Prediction: the marble reaches the joint at about ' + fmt(vj, 0) + ' cm/s. On a flat plank nothing slows it, so it keeps that speed.';
    } else {
      var dI = H0 / p.s2;
      if (dI > L2) { pred.className = 'pred warn'; pred.innerHTML = 'At this angle the marble would need ' + fmt(dI, 0) + ' cm of plank 2 to reach its starting height, but plank 2 is only ' + L2 + ' cm long. It will run off the end.'; }
      else pred.innerHTML = 'Prediction: the marble climbs back to a height of about ' + fmt(H0, 1) + ' cm, which is ' + fmt(dI, 0) + ' cm along plank 2.';
    }

    var pct = H0 > 0 ? Math.round(100 * peakY / H0) : 0;
    if (phase === 'ready') {
      msg = 'Marble held at the upper end of plank 1. Press Release.';
    } else if (phase === 'paused') {
      msg = 'Paused.';
    } else if (phase === 'done') {
      if (endReason === 'bottom') msg = 'Reached the bottom of plank 1 after ' + fmt(tSim, 2) + ' s at ' + fmt(endSpeed, 0) + ' cm/s.';
      else if (endReason === 'returned' || endReason === 'stopped') msg = 'Climbed to ' + fmt(peakY, 1) + ' cm (' + pct + '% of the starting height), ' + fmt(peakD, 0) + ' cm along plank 2' + (endReason === 'returned' ? ', then rolled back.' : ' and stopped.');

        if (p.s2 === 0) {
          msg = 'Reached the end of plank 2 still moving at ' + fmt(endSpeed, 0) + ' cm/s. ' +
                (p.fr === 0 ? 'Nothing slowed it down, so on a longer plank it would roll forever.' :

        } else { st.className = 'status warn'; msg = 'The marble ran off the end of plank 2. Make plank 2 steeper or lower the books.'; }

    } else if (mode === 1 || u < L1) {

      rows += '<tr><td>' + ang + '</td><td>' + dist + '</td><td>' + hgt + '</td></tr>';
    }
    $('tb').innerHTML = rows;
    $('tbl').hidden = !hasRows;
    clearEl.hidden = !hasRows;
  }

  function updateVehUI() {
    var p = readV(), ready = (phase === 'ready'), st = $('st'), pred = $('pred'), msg, deg = th * 180 / Math.PI, word, mx;
    $('vaOut').innerHTML = p.A + ' m/s²';
    $('vsOut').innerHTML = p.kmh + ' km/h';
    $('rTl').innerHTML = 'Time'; $('rVl').innerHTML = (mode === 7 ? 'Car speed' : 'Bus speed');
    $('rHl').innerHTML = mode === 7 ? 'Sideways acceleration' : 'Bus acceleration'; $('r4l').innerHTML = 'Lean of the body';
    cell('rT', fmt(vt, 2), 's');
    cell('rV', fmt(ready ? 0 : vv * 3.6, 0), 'km/h');
    cell('rH', fmt(ready ? 0 : vacc, 1), 'm/s²');
    if (Math.abs(deg) < 0.5) word = 'upright';
    else if (mode === 7) word = (deg > 0 ? 'to the right' : 'to the left');
    else word = (deg > 0 ? 'forward' : 'backward');
    cell('r4', fmt(Math.abs(deg), 0), '° ' + word);
    st.className = 'status'; pred.className = 'pred';
    if (mode === 5) pred.innerHTML = 'Prediction: braking at ' + p.A + ' m/s² brings the bus from ' + fmt(V0B * 3.6, 0) + ' km/h to a stop in ' + fmt(V0B / p.A, 1) + ' s.';
    else if (mode === 6) pred.innerHTML = 'Prediction: starting at ' + p.A + ' m/s² takes the bus from rest to ' + fmt(V1S * 3.6, 0) + ' km/h in ' + fmt(V1S / p.A, 1) + ' s.';
    else pred.innerHTML = 'Prediction: a turn of radius ' + p.R + ' m at ' + p.kmh + ' km/h needs a sideways acceleration of ' + fmt(p.V * p.V / p.R, 1) + ' m/s².';

    mx = Math.abs(thMax * 180 / Math.PI);
    if (phase === 'ready') {
      msg = mode === 5 ? 'The bus will cruise at ' + fmt(V0B * 3.6, 0) + ' km/h, then the driver brakes. Press Brake suddenly.' :
            mode === 6 ? 'The bus is at rest. Press Start suddenly.' : 'The car approaches a bend. Press Turn suddenly.';
    } else if (phase === 'paused') {
      msg = 'Paused.';
    } else if (phase === 'done') {
      msg = mode === 5 ? 'The upper body bent forward by up to ' + fmt(mx, 0) + '° while the bus slowed down.' :
            mode === 6 ? 'The upper body bent backward by up to ' + fmt(mx, 0) + '° while the bus picked up speed.' :
            'The body leaned ' + (thMax > 0 ? 'right' : 'left') + ' by up to ' + fmt(mx, 0) + '°, toward the outside of the turn.';
    } else if (mode === 5) {
      msg = vf > 0 ? 'Brakes on: the feet stop with the bus, but the upper body keeps moving forward.' :
            (vt < TB ? 'The bus moves at constant speed. The passenger stands upright.' : 'The bus has stopped. The passenger settles upright.');
    } else if (mode === 6) {
      msg = vf < 0 ? 'The bus starts: the feet move forward, but the upper body stays at rest, so it bends backward.' :
            (vt < TS ? 'The bus is at rest. The passenger stands upright.' : 'The bus now moves at constant speed. The passenger settles upright.');
    } else {
      msg = vf !== 0 ? 'The car turns ' + (p.dir > 0 ? 'left' : 'right') + ': the body tries to go straight, so it leans ' + (p.dir > 0 ? 'right' : 'left') + '.' :
            (vdist < 0 ? 'The car drives straight. The passenger sits upright.' : 'The turn is over. The passenger settles upright.');
    }
    st.innerHTML = msg;
    $('tbl').hidden = true; clearEl.hidden = true;
  }

  function updateUI() {
    if (mode <= 4) updatePlankUI(); else updateVehUI();
    labelGo();
  }

  /* ---------- running ---------- */
  var running = false, last = 0;
  function loop() {
    if (phase !== 'run') { running = false; return; }
    var now = Date.now(), dt = (now - last) / 1000;
    last = now; if (dt > 0.05) dt = 0.05;
    var sd = dt * parseFloat(rateEl.value), n = Math.max(1, Math.ceil(sd / DT)), h = sd / n;
    for (var i = 0; i < n && phase === 'run'; i++) { if (mode <= 4) stepPhys(h); else stepVeh(h); }
    render(); updateUI();
    if (phase === 'run') raf(loop); else running = false;
  }
  function startLoop() { last = Date.now(); if (!running) { running = true; raf(loop); } }

  function reset() {
    phase = 'ready'; u = U0; v = 0; tSim = 0; path = 0; yMax = 0; peaked = false; peakD = 0; peakY = 0; endReason = '';
    vt = 0; vv = 0; vacc = 0; vf = 0; th = 0; thd = 0; thMax = 0; vdist = (mode === 7) ? -LEAD : 0;
    render(); updateUI();
  }
  function sizeFor(w) {
    if (mode <= 4) return Math.round(Math.max(200, ((w - 44) / 226) * 92 + 52));
    if (mode <= 6) return Math.round(Math.max(210, Math.min(400, w * 0.55)));
    return Math.round(Math.max(300, Math.min(460, w * 0.9)));
  }
  function resize() {
    var w = cv.parentNode.clientWidth || 300;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cssW = w; cssH = sizeFor(w);
    cv.style.height = cssH + 'px';
    cv.width = Math.round(w * dpr); cv.height = Math.round(cssH * dpr);
    readColors(); render();
  }
  function setMode(m) {
    mode = m;
    for (var i = 1; i <= 7; i++) { mBtn[i].className = (i === m) ? 'on' : ''; mBtn[i].setAttribute('aria-pressed', i === m); }
    var veh = (m >= 5);
    $('plankCtl').hidden = veh; $('vehCtl').hidden = !veh;
    $('aWrap').hidden = (m !== 3);
    $('vaWrap').hidden = (m === 7); $('vsWrap').hidden = (m !== 7); $('vdWrap').hidden = (m !== 7);
    $('vaLbl').innerHTML = (m === 6) ? 'Starting strength' : 'Braking strength';
    if (m === 3) aEl.value = 30;
    if (m === 1 || veh) trials = [];
    $('story').innerHTML = STORY[m]; $('watch').innerHTML = WATCH[m]; $('note2').innerHTML = NOTE2[m];
    cv.setAttribute('aria-label', m <= 4 ? 'A marble rolling down a first plank and up a second plank' :
                    (m === 7 ? 'A car turning, with the passenger leaning toward the outside of the turn' :
                     'A passenger in a bus bending because of inertia'));
    resize(); reset();
  }

  goEl.onclick = function () {
    if (phase === 'done') reset();
    if (phase === 'ready') { if (mode <= 4) P = readP(); else VP = readV(); phase = 'run'; startLoop(); }
    else if (phase === 'paused') { phase = 'run'; startLoop(); }
    else if (phase === 'run') { phase = 'paused'; }
    updateUI();
  };
  resetEl.onclick = reset;
  clearEl.onclick = function () { trials = []; render(); updateUI(); };
  for (var mi = 1; mi <= 7; mi++) { (function (m) { mBtn[m].onclick = function () { setMode(m); }; })(mi); }
  var onBooks = function () { trials = []; reset(); };
  var onAny = function () { reset(); };
  hEl.oninput = onBooks; hEl.onchange = onBooks; frEl.onchange = onBooks;
  aEl.oninput = onAny; aEl.onchange = onAny;
  vaEl.oninput = onAny; vaEl.onchange = onAny; vsEl.oninput = onAny; vsEl.onchange = onAny; vdirEl.onchange = onAny;

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { window.setTimeout(resize, 200); });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onTheme = function () { readColors(); render(); };
    if (mq.addEventListener) mq.addEventListener('change', onTheme); else if (mq.addListener) mq.addListener(onTheme);
  }
  if (window.MutationObserver) {
    new MutationObserver(function () { readColors(); render(); })
      .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  }

  setMode(1);
})();
</script>
